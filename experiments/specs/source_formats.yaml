experiment: source_formats
description: |
  Source-file encodings: dense text SEDS against every EDZ variant, and gzip.

  A bitset costs ceil(paths/8) bytes per entry regardless of contents, so EDZ
  wins only when entries are dense. The deciding factor is the allele-frequency
  spectrum, not the path count: on common-variant data (1000G-like) edz-sparse
  and edz-compressed win by 2-6x, while on rare-variant panels (M. tuberculosis)
  the ranking inverts and worsens with scale — a variant carried by 3 of 1141
  isolates is 143 bytes as a bitset and ~12 as {5,88,900}.

  gzip of the text SEDS is the baseline that has to be beaten, and on rare-variant
  data it currently wins by ~8x. It comes free here: the gather phase sizes every
  artifact compressed as well as raw, so `gzip_bytes` is a column, not a separate
  measurement.

  Open question this is meant to answer: edz-compressed has never been measured
  on rare-variant data. See TODO.md.

resolve:
  prefer:
    - build/tools

binaries:
  edsparser-source-transform:
    provenance:
      require_fields: [COMMIT, COMMIT_DATE, DIRTY]
  edsparser-stats: {}

policy:
  mem_cap: 8G
  mem_budget: 16G
  timeout: 1800s
  reps: 1
  jobs: 4

gather:
  gzip: true             # the point of the experiment: raw vs gzip vs EDZ
  gzip_level: 6
  gzip_max_bytes: 8G
  count_lines_ext: [".seds"]
  jobs: 4

# --------------------------------------------------------------------------
# Datasets — a .seds to re-encode, and the path count that decides the outcome.
# --------------------------------------------------------------------------
datasets:
  covid_20E:
    inputs:
      seds: ~/Data/covid/derived/eds/20E.seds
      eds:  ~/Data/covid/derived/eds/20E.eds
    probe: &stats_probe
      cmd: "{edsparser-stats} -i {in.eds} -s {in.seds} --verbose"
      extract:
        num_paths:      {regex: 'Total paths \(genomes\):\s+([0-9.]+)', cast: int_grouped}
        m_strings:      {regex: 'Total strings \(m\):\s+([0-9.]+)', cast: int_grouped}
        avg_paths_per_string: {regex: 'Avg paths per string:\s+([0-9.,]+)', cast: float_comma}

  # The rare-variant panels, where the bitset formats are expected to lose.
  tb_p100:
    inputs:
      seds: ~/Data/tb/panel_100/eds/NC_000962.3.seds
      eds:  ~/Data/tb/panel_100/eds/NC_000962.3.eds
    probe: *stats_probe

  tb_p500:
    inputs:
      seds: ~/Data/tb/panel_500/eds/NC_000962.3.seds
      eds:  ~/Data/tb/panel_500/eds/NC_000962.3.eds
    probe: *stats_probe

  tb_p1141:
    inputs:
      seds: ~/Data/tb/panel_1141/eds/NC_000962.3.seds
      eds:  ~/Data/tb/panel_1141/eds/NC_000962.3.eds
    probe: *stats_probe

stages: [convert]

# --------------------------------------------------------------------------
# Tools — one per target encoding. All EDZ variants share the .edz extension
# and are distinguished by header flags, so the variant is chosen with --to
# rather than by naming the file differently.
#
# The `seds` tool re-encodes text to text: a no-op transcode that exists as the
# control, so the baseline size is measured by the same code path as the rest.
# --------------------------------------------------------------------------
tools:
  seds:
    label: SEDS (dense text)
    stages:
      convert: &convert
        cmd: "{edsparser-source-transform} -i {in.seds} -o {out}/sources.seds --to seds"
        produces: {sources: "{out}/sources.seds"}
        parallel: false
        extract:
          tool_peak_mb: {from: stderr, regex: 'Peak Memory:\s*([0-9.]+) MB'}

  seds_sparse:
    label: SEDS sparse (text, universal entries omitted)
    stages:
      convert:
        <<: *convert
        cmd: "{edsparser-source-transform} -i {in.seds} -o {out}/sources.seds --to seds_sparse"

  edz:
    label: EDZ (dense bitset)
    stages:
      convert:
        <<: *convert
        cmd: "{edsparser-source-transform} -i {in.seds} -o {out}/sources.edz --to edz"
        produces: {sources: "{out}/sources.edz"}

  edz_sparse:
    label: EDZ sparse
    stages:
      convert:
        <<: *convert
        cmd: "{edsparser-source-transform} -i {in.seds} -o {out}/sources.edz --to edz_sparse"
        produces: {sources: "{out}/sources.edz"}

  edz_compressed:
    label: EDZ compressed (zstd blocks)
    stages:
      convert:
        <<: *convert
        # Requires a zstd-enabled build; without one this errors cleanly rather
        # than writing a corrupt file, and the row records the failure.
        cmd: "{edsparser-source-transform} -i {in.seds} -o {out}/sources.edz --to edz_compressed"
        produces: {sources: "{out}/sources.edz"}

plots:
  - id: size_by_format
    stage: convert
    kind: bar
    x: tool
    y: artifact_bytes
    facet: dataset
    logy: true
    title: "Source file size by encoding"
    ylabel: bytes

  - id: gzip_vs_raw
    stage: convert
    kind: bar
    x: tool
    y: artifact_gzip_bytes
    facet: dataset
    logy: true
    title: "…and the same files gzipped — the baseline every format must beat"
    ylabel: bytes (gzip -6)

  - id: convert_time
    stage: convert
    kind: bar
    x: tool
    y: wall_s_min
    facet: dataset
    title: "Re-encode cost"
    ylabel: seconds
