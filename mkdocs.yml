site_name: EDSParser
site_description: C++ library and CLI suite for Elastic-Degenerate Strings
site_url: https://draessld.github.io/EDSParser
repo_url: https://github.com/draessld/EDSParser
repo_name: draessld/EDSParser
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: green
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - File Formats: formats.md
  - CLI Tools: cli-tools.md
  - Library API: library-api.md
  - Architecture: architecture.md
  - Algorithms: algorithms.md
  - Performance: performance.md
  - Testing: testing.md
  - Experiments: experiments.md
